[package]
name = "quat_db"
version = "0.4.0"
edition = "2024"
authors = ["Strale <strahinjastojanovic826@gmail.com>"]
description = "High-performance 4-state (2-bit quat) embedded database engine"
readme = "README.md"
license = "AGPL-3.0-or-later"
repository = "https://github.com/strahinjastojanovic826-code/qdb"
keywords = ["quat", "database", "bit-packing", "no-deps", "storage"]
categories = ["database-implementations", "data-structures"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
memmap2 = "0.9"
thiserror = "1.0"
parking_lot = "0.12"
